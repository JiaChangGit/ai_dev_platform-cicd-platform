    expect: [external/anthropic-skills/skills/docx/SKILL.md]
    forbid: [external/anthropic-skills/skills/pdf/SKILL.md, external/anthropic-skills/skills/xlsx/SKILL.md]
  - prompt: "只讀取這份 PDF 並擷取表格"
    expect: [external/anthropic-skills/skills/pdf/SKILL.md]
    forbid: [external/anthropic-skills/skills/docx/SKILL.md]
  - prompt: "Debug this failing unit test and find the root cause"
    expect: [external/superpowers/systematic-debugging/SKILL.md]
    forbid: [external/mattpocock-skills/engineering/diagnosing-bugs/SKILL.md]
  - prompt: "Use red-green-refactor TDD to implement this feature"
    expect: [external/superpowers/test-driven-development/SKILL.md]
    forbid: [external/mattpocock-skills/engineering/tdd/SKILL.md]
