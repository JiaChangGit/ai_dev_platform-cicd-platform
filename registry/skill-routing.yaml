# 第三方 skill 路由規則
#
# external/ 只是離線來源，不是自動安裝目錄。載入 skill 前先依本檔案
# 判斷邊界，再讀取對應 SKILL.md。第三方 frontmatter 不得覆寫平台治理。

schemaVersion: 1

discovery:
  includedRoots:
    - external/anthropic-skills/skills
    - external/mattpocock-skills/engineering
    - external/mattpocock-skills/misc
    - external/mattpocock-skills/productivity
    - external/openai-cookbook/.codex/skills/docs-editor
    - external/openai-cookbook/examples/evals/realtime_evals/skills/bootstrap-realtime-eval
    - external/superpowers
  excludedRoots:
    - external/anthropic-skills/template
    - external/mattpocock-skills/deprecated
    - external/mattpocock-skills/in-progress

validation:
  expectedPackagedSkillCount: 62
  maxSkillLines: 500
  maxDescriptionCharacters: 1200
  allowedUpstreamFrontmatter: [name, description, license, disable-model-invocation, argument-hint]
  disallowedPackagedPaths:
    - external/openai-cookbook/README.md
    - external/mattpocock-skills/engineering/README.md
    - external/mattpocock-skills/misc/README.md
    - external/mattpocock-skills/productivity/README.md
    - external/superpowers/systematic-debugging/CREATION-LOG.md
    - external/superpowers/systematic-debugging/test-academic.md
    - external/superpowers/systematic-debugging/test-pressure-1.md
    - external/superpowers/systematic-debugging/test-pressure-2.md
    - external/superpowers/systematic-debugging/test-pressure-3.md
  acceptedLengthExceptions:
    - path: external/anthropic-skills/skills/claude-api/SKILL.md
      reason: "上游將路由限制與 API 參考入口合併在同一份檔案；平台另加供應商限制。"
    - path: external/superpowers/subagent-driven-development/SKILL.md
      reason: "上游完整工作階段略超過建議長度；只在有書面計畫且可使用子代理人時載入。"
    - path: external/superpowers/writing-skills/SKILL.md
      reason: "上游同時收納撰寫與驗證方法；平台只在明確點名此 skill 時使用。"

precedence:
  - "使用者明確點名的 skill"
  - "明確檔案類型，例如 .docx、.pdf、.pptx、.xlsx"
  - "明確供應商、儲存庫或產品領域"
  - "任務階段，例如診斷、規劃、實作、審查、收尾"
  - "通用生產力 skill"

platformRules:
  - "AGENTS.md、workflow/ 與 governance/ 的強制規則優先於第三方 skill。"
  - "manualOnly 項目只有使用者明確點名或使用對應指令時才載入。"
  - "restrictedAutomatic 項目必須同時符合 requireAny，命中 excludeAny 時不得載入。"
  - "collisionGroups 同時命中時只選 primary；除非使用者明確要求組合。"
  - "只讀、說明或診斷任務不得因 skill 建議擴大為實作或對外發布。"

manualOnly:
  - external/mattpocock-skills/engineering/ask-matt/SKILL.md
  - external/mattpocock-skills/engineering/grill-with-docs/SKILL.md
  - external/mattpocock-skills/engineering/implement/SKILL.md
  - external/mattpocock-skills/engineering/improve-codebase-architecture/SKILL.md
  - external/mattpocock-skills/engineering/research/SKILL.md
  - external/mattpocock-skills/engineering/setup-matt-pocock-skills/SKILL.md
  - external/mattpocock-skills/engineering/to-spec/SKILL.md
  - external/mattpocock-skills/engineering/to-tickets/SKILL.md
  - external/mattpocock-skills/engineering/triage/SKILL.md
  - external/mattpocock-skills/engineering/wayfinder/SKILL.md
  - external/mattpocock-skills/productivity/grill-me/SKILL.md
  - external/mattpocock-skills/productivity/handoff/SKILL.md
  - external/mattpocock-skills/productivity/teach/SKILL.md
  - external/mattpocock-skills/productivity/to-questionnaire/SKILL.md
  - external/mattpocock-skills/productivity/wait-what/SKILL.md
  - external/superpowers/writing-skills/SKILL.md

bootstrapOnly:
  - path: external/superpowers/using-superpowers/SKILL.md
    reason: "只在使用者明確啟用 superpowers 時讀取；不接受上游『每次對話』的廣泛觸發。"

restrictedAutomatic:
  - path: external/anthropic-skills/skills/claude-api/SKILL.md
    requireAny: [claude, anthropic, opus, sonnet, haiku, "@anthropic-ai"]
    excludeAny: [openai, chatgpt, gpt, gemini, llama, mistral, cohere, ollama]
    reason: "不接受上游對『供應商未指定的 LLM 任務』自動命中。"
  - path: external/anthropic-skills/skills/brand-guidelines/SKILL.md
    requireAny: [anthropic, "anthropic brand", "anthropic 品牌"]
    excludeAny: []
    reason: "內容是 Anthropic 品牌規範，不可套用到一般公司或產品。"
  - path: external/anthropic-skills/skills/internal-comms/SKILL.md
    requireAny: [internal communication, status update, leadership update, "內部溝通", "進度更新"]
    excludeAny: [public announcement, press release, "對外公告", "新聞稿"]
    reason: "內部溝通格式不得誤用於對外內容。"
  - path: external/openai-cookbook/.codex/skills/docs-editor/SKILL.md
    requireAny: [openai cookbook, openai-cookbook, cookbook notebook, cookbook mdx]
    excludeAny: [realtime eval, realtime_evals, crawl eval, walk eval, run eval]
    reason: "只適用 OpenAI Cookbook 文件編輯；realtime eval 骨架交由專用 skill。"
  - path: external/openai-cookbook/examples/evals/realtime_evals/skills/bootstrap-realtime-eval/SKILL.md
    requireAny: [realtime eval, realtime_evals, crawl eval, walk eval, run eval]
    excludeAny: []
    reason: "只建立 Cookbook realtime eval 骨架，不是通用評測 skill。"

collisionGroups:
  - id: debug-method
    primary: external/superpowers/systematic-debugging/SKILL.md
    alternatives:
      - external/mattpocock-skills/engineering/diagnosing-bugs/SKILL.md
    selection: "預設使用 systematic-debugging；只有明確要求 Matt Pocock 診斷流程時改用替代項。"
  - id: tdd-method
    primary: external/superpowers/test-driven-development/SKILL.md
    alternatives:
      - external/mattpocock-skills/engineering/tdd/SKILL.md
    selection: "預設使用 superpowers TDD；明確點名 Matt TDD 才切換。"
  - id: skill-authoring
    primary: external/anthropic-skills/skills/skill-creator/SKILL.md
    alternatives:
      - external/superpowers/writing-skills/SKILL.md
      - external/mattpocock-skills/productivity/writing-for-agents/SKILL.md
    selection: "建立／修改 skill 用 skill-creator；writing-skills 只供明確點名的驗證流程；writing-for-agents 用於 AGENTS.md／CLAUDE.md。"
  - id: design-interview
    primary: external/superpowers/brainstorming/SKILL.md
    alternatives:
      - external/mattpocock-skills/productivity/grill-me/SKILL.md
      - external/mattpocock-skills/productivity/grilling/SKILL.md
      - external/mattpocock-skills/engineering/grill-with-docs/SKILL.md
    selection: "一般功能設計用 brainstorming；明確說 grill 時用 grilling；grill-me 只供手動呼叫；要同時產生 ADR／詞彙表時手動呼叫 grill-with-docs。"
  - id: review-phase
    primary: external/mattpocock-skills/engineering/code-review/SKILL.md
    alternatives:
      - external/superpowers/requesting-code-review/SKILL.md
      - external/superpowers/receiving-code-review/SKILL.md
    selection: "審查 diff／PR 用 code-review；邀請審查用 requesting-code-review；處理審查意見用 receiving-code-review。"
  - id: handoff
    primary: templates/task-handoff.md
    alternatives:
      - external/mattpocock-skills/productivity/handoff/SKILL.md
    selection: "workflow 要求的角色交接一律使用平台範本；第三方 handoff 只供明確點名的對話壓縮。"
  - id: architecture-review
    primary: external/mattpocock-skills/engineering/codebase-design/SKILL.md
    alternatives:
      - external/mattpocock-skills/engineering/improve-codebase-architecture/SKILL.md
    selection: "設計或調整模組介面時用 codebase-design；掃描整個程式庫並產生 HTML 報告時，必須手動呼叫 improve-codebase-architecture。"

