# external/subtrees.yaml
#
# scripts/sync.sh 讀取此檔案，執行 git subtree add / pull。
# 使用前請將 repo 換成「你 fork 到自己帳號/組織下」的版本，
# 這樣才能透過 git subtree push 把本地修改回饋上游，也方便日後 pull 更新。
#
# 欄位：
#   name   目錄名稱，需與 prefix 最後一段一致
#   repo   git remote URL（建議使用你自己的 fork，而非直接指向原始上游）
#   branch 要追蹤的分支
#   prefix 併入本倉庫的路徑
#
# 注意：scripts/sync.sh 用的是針對此固定格式寫的輕量解析器，
# 不是通用 YAML parser，請維持這個縮排/欄位順序。

subtrees:
  - name: anthropic-skills
    repo: https://github.com/JiaChangGit/anthropic-skills.git
    branch: main
    prefix: external/anthropic-skills

  - name: openai-cookbook
    repo: https://github.com/JiaChangGit/openai-cookbook.git
    branch: main
    prefix: external/openai-cookbook

  # 以下兩項是已同步的子資料夾 subtree split（不是整個上游倉庫）。
  # branch 不是上游的預設分支，是 fork 內保存子樹歷程的分支名稱。
  #
  # mattpocock-skills 同步的是整個 skills/ 資料夾而不是只有 grill-with-docs，
  # 原因是 grill-with-docs 依賴同倉庫內另外兩個不同層級的技能資料夾，沒有比
  # skills/ 更小的共同上層資料夾能一次涵蓋。
  - name: mattpocock-skills
    repo: https://github.com/JiaChangGit/skills.git
    branch: extract-mattpocock-skills
    prefix: external/mattpocock-skills

  - name: superpowers
    repo: https://github.com/JiaChangGit/superpowers.git
    branch: extract-skills
    prefix: external/superpowers
