# .gitlab-ci.yml
#
# 範例 pipeline：驗證 ai-dev-platform 倉庫自身的完整性 + commit message 格式。
# 套用到產品倉庫（product-cicd-platform）時，把 self-check 步驟換成產品倉庫
# 自己的 build/test/lint，commit-lint 步驟可直接沿用（產品無關）。
# 詳見 docs/how-enforce-rules.md。

stages:
  - check

variables:
  GIT_DEPTH: "0"  # commit-lint --range 需要完整歷史

self-check:
  stage: check
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash >/dev/null
    - pip install pyyaml --quiet
  script:
    - bash scripts/check.sh

commit-lint:
  stage: check
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash >/dev/null
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        bash scripts/commit-lint.sh --range "$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
      else
        bash scripts/commit-lint.sh "$CI_COMMIT_SHA"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
