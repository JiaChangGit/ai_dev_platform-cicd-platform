# .gitlab-ci.yml
#
# 範例 pipeline：驗證 ai-dev-platform 儲存庫自身的完整性 + commit message 格式。
# 套用到產品儲存庫（product-cicd-platform）時，把 self-check 步驟換成產品儲存庫
# 自己的 build/test/lint，commit-lint 步驟可直接沿用（產品無關）。
# 詳見 docs/ci-cd-release.md。

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ENABLE_GITLAB_MAIN_CI == "true"'
    - when: never

stages:
  - check

variables:
  GIT_DEPTH: "0"  # commit-lint --range 需要完整歷史

self-check:
  stage: check
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash build-essential >/dev/null
    - python3 -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.3"
  script:
    - bash scripts/check.sh
    - python3 -m py_compile scripts/init_product.py scripts/install_platform.py scripts/audit_workspace.py scripts/pre_push_audit.py scripts/package_release.py scripts/generate_sbom.py scripts/verify_package.py scripts/verify_release_evidence.py scripts/verify_release_layout.py scripts/verify_release_readiness.py scripts/validate_ci_adapters.py scripts/manage_collaborators.py examples/spec-notes/validate.py
    - python3 -B -m unittest discover -s tests -v
    - python3 -B scripts/manage_collaborators.py check
    # GitLab runner 的 origin 可能含短期 CI 憑證；稽核前改回不含憑證的專案 URL。
    - git remote set-url origin "${CI_PROJECT_URL}.git"
    # --ci 只略過 runner 的 user.name／user.email，其他安全檢查不變。
    - python3 -B scripts/pre_push_audit.py --ci
    - python3 scripts/package_release.py --dry-run --source-ref "$CI_COMMIT_SHA"

commit-lint:
  stage: check
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash >/dev/null
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        bash scripts/commit-lint.sh --range "$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
      else
        bash scripts/commit-lint.sh "$CI_COMMIT_SHA"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
