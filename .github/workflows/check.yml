# .github/workflows/check.yml
#
# 範例 pipeline：驗證 ai-dev-platform 儲存庫自身的完整性 + commit message 格式。
# 套用到產品儲存庫（product-cicd-platform）時，把 self-check 步驟換成產品儲存庫
# 自己的 build/test/lint，commit-lint 步驟可直接沿用（產品無關）。
# 詳見 docs/ci-cd-release.md。

name: check

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # commit-lint --range 需要完整歷史

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML（供 scripts/check.sh 做 YAML 語法檢查）
        run: python3 -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.3"

      - name: Run repository self-check
        run: bash scripts/check.sh

      - name: Validate offline release package plan
        run: |
          python3 -m py_compile \
            scripts/init_product.py \
            scripts/install_platform.py \
            scripts/audit_workspace.py \
            scripts/pre_push_audit.py \
            scripts/package_release.py \
            scripts/generate_sbom.py \
            scripts/verify_package.py \
            scripts/verify_release_evidence.py \
            scripts/verify_release_layout.py \
            scripts/verify_release_readiness.py \
            scripts/validate_ci_adapters.py \
            scripts/manage_collaborators.py
          python3 -m unittest discover -s tests -v
          python3 -B scripts/manage_collaborators.py check
          # CI runner 不建立 commit；--ci 只略過 user.name／user.email，其他安全檢查不變。
          python3 -B scripts/pre_push_audit.py --ci
          python3 scripts/package_release.py --dry-run --source-ref "${{ github.sha }}"

      - name: Lint commit messages (PR)
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/commit-lint.sh --range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Lint commit message (push)
        if: github.event_name == 'push'
        run: bash scripts/commit-lint.sh HEAD

  android-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.4.1"

      - name: Build, test and lint Android example
        working-directory: examples/android-app
        run: |
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:lintDebug
